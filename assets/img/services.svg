<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Abstract stacked forms representing cross-border transactions">
  <defs>
    <linearGradient id="sb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceef4"/>
      <stop offset="1" stop-color="#d5d7e0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sb)"/>
  <g transform="rotate(-8 600 450)">
    <rect x="300" y="150" width="520" height="620" fill="#ffffff"/>
    <g fill="#383b43" opacity="0.16">
      <rect x="360" y="220" width="400" height="10"/>
      <rect x="360" y="255" width="400" height="10"/>
      <rect x="360" y="290" width="330" height="10"/>
    </g>
    <rect x="360" y="360" width="180" height="14" fill="#2611c9"/>
    <g fill="#1b1b1b" opacity="0.1">
      <rect x="360" y="420" width="400" height="10"/>
      <rect x="360" y="455" width="400" height="10"/>
      <rect x="360" y="490" width="250" height="10"/>
      <rect x="360" y="560" width="400" height="10"/>
      <rect x="360" y="595" width="370" height="10"/>
    </g>
    <rect x="360" y="660" width="120" height="44" fill="#2611c9"/>
  </g>
  <g transform="rotate(6 760 500)">
    <rect x="600" y="260" width="440" height="560" fill="#1b1b1b"/>
    <rect x="600" y="260" width="440" height="560" fill="none" stroke="#2611c9" stroke-width="2"/>
    <g fill="#ffffff" opacity="0.3">
      <rect x="650" y="330" width="340" height="9"/>
      <rect x="650" y="362" width="340" height="9"/>
      <rect x="650" y="394" width="220" height="9"/>
    </g>
    <rect x="650" y="450" width="140" height="12" fill="#2611c9"/>
    <g fill="#ffffff" opacity="0.14">
      <rect x="650" y="510" width="340" height="9"/>
      <rect x="650" y="542" width="340" height="9"/>
      <rect x="650" y="574" width="190" height="9"/>
    </g>
    <rect x="650" y="700" width="110" height="40" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
